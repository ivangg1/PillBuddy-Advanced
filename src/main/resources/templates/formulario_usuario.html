<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulario Usuario - PillBuddy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h3 class="text-center">Datos del Usuario</h3>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="POST">
                            
                            <input type="hidden" th:field="*{id}" />

                            <div class="mb-3">
                                <label>Username:</label>
                                <input type="text" th:field="*{username}" class="form-control" required />
                            </div>

                            <div class="mb-3">
                                <label>Password:</label>
                                <input type="password" th:field="*{password}" class="form-control" required />
                            </div>

                            <div class="mb-3">
                                <label>Nombre Completo:</label>
                                <input type="text" th:field="*{nombre}" class="form-control" required />
                            </div>

                            <div class="mb-3">
                                <label>Edad:</label>
                                <input type="number" th:field="*{edad}" class="form-control" required />
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success">Guardar</button>
                                <a th:href="@{/usuarios}" class="btn btn-secondary">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
